workflows:
  logo-finder:
    name: Logo Finder APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Unzip, download model and build
        script: |
          set -e
          unzip -q -o LogoFinder.zip
          cd LogoFinder
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/mobilenet_v3_large.tflite \
            "https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_large/float32/latest/mobilenet_v3_large.tflite"
          SIZE=$(wc -c < app/src/main/assets/mobilenet_v3_large.tflite)
          echo "Model size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then echo "Model download failed"; exit 1; fi

          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle-dist"
          "$HOME/gradle-dist/gradle-8.9/bin/gradle" assembleDebug --no-daemon --stacktrace
    artifacts:
      - LogoFinder/app/build/outputs/apk/**/*.apk
